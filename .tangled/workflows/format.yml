when:
  - event: [push, pull_request]
    branch: ["*"]

engine: microvm
image: nixos
dependencies:
  - haxe

steps:
  - name: Set up Haxelib
    command: haxelib newrepo
  - name: Install formatter
    command: haxelib install formatter 1.18.0 --quiet
  - name: Run formatter
    command: haxelib run formatter --check --source src --source tests
